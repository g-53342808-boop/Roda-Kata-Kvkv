.menu button,

/* =========================
   PAPARAN PEMBELAJARAN
========================= */

.lesson-card{
    max-width:650px;
    margin:auto;
    background:white;
    border-radius:30px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.lesson-card img{
    width:260px;
    height:220px;
    object-fit:contain;
    border-radius:20px;
    margin-bottom:15px;
}

.question{
    font-size:28px;
    font-weight:bold;
    margin:15px 0;
}

.syllable-options{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin:15px 0;
}

.syllable-btn{
    border:none;
    border-radius:18px;
    padding:14px 25px;
    background:#e8f1ff;
    font-size:28px;
    cursor:pointer;
    min-width:90px;
    box-shadow:0 4px 8px rgba(0,0,0,.12);
}

.syllable-btn:hover{
    transform:scale(1.06);
}

.syllable-btn.correct{
    background:#66bb6a;
    color:white;
}

.syllable-btn.wrong{
    background:#ef5350;
    color:white;
}

.answer{
    display:none;
    font-size:36px;
    font-weight:bold;
    color:#1769aa;
    margin:20px 0;
}

.answer.show{
    display:block;
}

/* =========================
   RODA
========================= */

.wheel-area{
    position:relative;
    width:370px;
    height:370px;
    margin:20px auto;
}

#wheel{
    width:350px;
    height:350px;
    border-radius:50%;
    position:absolute;
    left:10px;
    top:10px;
    overflow:hidden;
    background:white;
    border:10px solid #ffffff;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.wheel-items{
    width:100%;
    height:100%;
    position:relative;
}

.wheel-item{
    position:absolute;
    width:50%;
    height:50%;
    left:25%;
    top:25%;
    transform-origin:50% 100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.wheel-item img{
    width:100px;
    height:90px;
    object-fit:contain;
    margin-top:8px;
}

.pointer{
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:45px solid #e53935;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));
}

.spin-btn{
    background:#ff8f00;
    color:white;
    border:none;
    border-radius:20px;
    padding:16px 35px;
    font-size:28px;
    cursor:pointer;
    box-shadow:0 5px 10px rgba(0,0,0,.2);
}

.spin-btn:disabled{
    opacity:.6;
}

.result{
    max-width:600px;
    margin:20px auto;
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.result img{
    width:220px;
    height:180px;
    object-fit:contain;
}

.result-word{
    display:none;
    font-size:35px;
    font-weight:bold;
    color:#1769aa;
}

   PILIH GAME
========================= */

.drop-box{

.keyboard-word{

.keyboard{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;

.key{
    border:none;

.firework{

    height:10px;
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    animation:explode 1s ease-out forwards;
}

@keyframes explode{
    0%{
        transform:translate(0,0) scale(1);
        opacity:1;
    }
    100%{
        transform:translate(var(--x),var(--y)) scale(.2);
        opacity:0;
    }

/* =========================
   AUDIO
========================= */

let audioContext = null;

function mulaAudio(){

    if(!audioContext){
        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}


function bunyiNada(freq,durasi,masa=0,type="sine"){

    mulaAudio();

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.0001,
        audioContext.currentTime + masa);

    gain.gain.exponentialRampToValueAtTime(
        0.22,
        audioContext.currentTime + masa + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + masa + durasi
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(audioContext.currentTime + masa);
    osc.stop(audioContext.currentTime + masa + durasi + 0.03);
}


function bunyiBetul(){

    bunyiNada(523,0.18,0,"sine");
    bunyiNada(659,0.18,0.13,"sine");
    bunyiNada(784,0.30,0.26,"sine");
}


function bunyiSalah(){

    bunyiNada(180,0.25,0,"square");
    bunyiNada(120,0.30,0.18,"square");
}

function ciptaBungaApi(jumlah=30,besar=false){

    for(let i=0;i<jumlah;i++){

        const firework =
            document.createElement("div");

        firework.className="firework";

        const x =
            Math.random() * window.innerWidth;

        const y =
            Math.random() *
            (window.innerHeight * 0.65);

        firework.style.left=x+"px";
        firework.style.top=y+"px";

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            (besar ? 100 : 60) +
            Math.random() * (besar ? 150 : 80);

        firework.style.setProperty(
            "--x",
            Math.cos(angle)*distance+"px"
        );

        firework.style.setProperty(
            "--y",
            Math.sin(angle)*distance+"px"
        );

        document.body.appendChild(firework);

        setTimeout(()=>{
            firework.remove();
        },1100);
    }
}

/* =========================

========================= */

function bukaScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(s=>s.classList.remove("active"));

    document
        .getElementById(id)
        .classList.add("active");

    window.scrollTo(0,0);

/* =========================
   PENGAJARAN
========================= */

let lessonIndex=0;
let lessonStep=1;
let lessonSuku1="";
let lessonSuku2="";


function mulaPengajaran(){

    const item =
        bahan[lessonIndex];

    document.getElementById("lessonImage")
        .src=item.gambar;

    document.getElementById("lessonQuestion")
        .innerHTML=
        "Pilih suku kata pertama:";

    document.getElementById("lessonAnswer")
        .classList.remove("show");

    lessonStep=1;
    lessonSuku1="";
    lessonSuku2="";

    binaPilihanPengajaran();

    lessonIndex++;

    if(lessonIndex >= bahan.length){
        lessonIndex=0;
    }
}


function binaPilihanPengajaran(){

    const item =
        bahan[
            lessonIndex === 0 ?
            bahan.length-1 :
            lessonIndex-1
        ];

    const box1 =
        document.getElementById("lessonOptions1");

    const box2 =
        document.getElementById("lessonOptions2");

    box1.innerHTML="";
    box2.innerHTML="";

    item.pilihan1.forEach(x=>{

        const btn =
            document.createElement("button");

        btn.className="syllable-btn";
        btn.textContent=x;

        btn.onclick=()=>{
            pilihSukuPengajaran(
                x,
                item.suku1,
                1,
                item
            );
        };

        box1.appendChild(btn);
    });
}


function binaPilihan2Pengajaran(item){

    const box =
        document.getElementById("lessonOptions2");

    box.innerHTML="";

    item.pilihan2.forEach(x=>{

        const btn =
            document.createElement("button");

        btn.className="syllable-btn";
        btn.textContent=x;

        btn.onclick=()=>{
            pilihSukuPengajaran(
                x,
                item.suku2,
                2,
                item
            );
        };

        box.appendChild(btn);
    });
}


function pilihSukuPengajaran(
    pilihan,
    jawapan,
    bahagian,
    item
){

    mulaAudio();

    if(pilihan !== jawapan){

        bunyiSalah();

        const buttons =
            bahagian===1 ?
            document.querySelectorAll(
                "#lessonOptions1 .syllable-btn"
            ) :
            document.querySelectorAll(
                "#lessonOptions2 .syllable-btn"
            );

        buttons.forEach(btn=>{
            if(btn.textContent===pilihan){
                btn.classList.add("wrong");

                setTimeout(()=>{
                    btn.classList.remove("wrong");
                },500);
            }
        });

        return;
    }

    bunyiBetul();
    mercunKecil();

    if(bahagian===1){

        lessonSuku1=pilihan;

        document.getElementById("lessonQuestion")
            .innerHTML=
            "Pilih suku kata kedua:";

        document.getElementById("lessonOptions1")
            .innerHTML="";

        binaPilihan2Pengajaran(item);

    }else{

        lessonSuku2=pilihan;

        const answer =
            `${lessonSuku1} + ${lessonSuku2} = ${item.perkataan}`;

        document.getElementById("lessonAnswer")
            .textContent=answer;

        document.getElementById("lessonAnswer")
            .classList.add("show");

        document.getElementById("lessonQuestion")
            .innerHTML="🎉 Tahniah! Jawapan betul.";

        bunyiTahniah();
        mercunBesar();
    }
}


/* =========================
   RODA
========================= */

let wheelRotation=0;
let spinning=false;
let currentWheelIndex=0;


function binaRoda(){

    const container =
        document.getElementById("wheelItems");

    container.innerHTML="";

    const jumlah=bahan.length;

    bahan.forEach((item,index)=>{

        const div =
            document.createElement("div");

        div.className="wheel-item";

        const angle =
            index * (360/jumlah);

        div.style.transform=
            `rotate(${angle}deg)`;

        const img =
            document.createElement("img");

        img.src=item.gambar;
        img.alt=item.perkataan;

        div.appendChild(img);

        container.appendChild(div);
    });
}


function pusingRoda(){

    if(spinning)return;

    mulaAudio();

    spinning=true;

    document.getElementById("spinButton")
        .disabled=true;

    const jumlah=bahan.length;

    currentWheelIndex =
        Math.floor(Math.random()*jumlah);

    const setiap =
        360/jumlah;

    const sasaran =
        (360 -
        currentWheelIndex*setiap -
        setiap/2);

    wheelRotation +=
        360*6 + sasaran;

    const wheel =
        document.getElementById("wheel");

    wheel.style.transition=
        "transform 4s cubic-bezier(.17,.67,.12,.99)";

    wheel.style.transform=
        `rotate(${wheelRotation}deg)`;

    setTimeout(()=>{

        spinning=false;

        document.getElementById("spinButton")
            .disabled=false;

        paparRoda(currentWheelIndex);

    },4200);
}


function paparRoda(index){

    const item=bahan[index];

    const result =
        document.getElementById("wheelResult");

    result.style.display="block";

    document.getElementById("wheelResultImage")
        .src=item.gambar;

    document.getElementById("wheelResultQuestion")
        .textContent=
        "Pilih suku kata pertama:";

    document.getElementById("wheelAnswer")
        .classList.remove("show");

    binaPilihanRoda1(item);
}


let rodaSuku1="";
let rodaSuku2="";


function binaPilihanRoda1(item){

function binaPilihanRoda2(item){

    const box =

        const btn =
            document.createElement("button");

        btn.className="syllable-btn";

){

/* =========================
   GAMES
========================= */

let gameNumber=0;
let gameIndex=0;
let gameScore=0;
let gameLives=3;
let gameAnswered=0;

let g1Current=null;
let g1Part=1;

let g3Typed="";


function mulaGame(n){

    gameNumber=n;
    gameIndex=0;
    gameScore=0;
    gameLives=3;
    gameAnswered=0;
    g3Typed="";

    bukaScreen("game"+n);

    if(n===1){
        paparGame1();
    }

    if(n===2){
        paparGame2();
    }

    if(n===3){
        binaKeyboard();
        paparGame3();
    }
}


function paparStatus(prefix){

    document.getElementById(prefix+"Score")
        .textContent=
        `Markah: ${gameScore}`;

    document.getElementById(prefix+"Lives")
        .textContent=
        `Nyawa: ${"❤️".repeat(gameLives)}`;
}


/* =========================
   GAME 1
========================= */

function paparGame1(){

    if(gameIndex>=bahan.length){
        tamatGame(1);
        return;
    }

    g1Current=bahan[gameIndex];
    g1Part=1;

    paparStatus("g1");

    document.getElementById("g1Image")
        .src=g1Current.gambar;

    document.getElementById("g1Question")
        .textContent=
        "Lengkapkan suku kata:";

    document.getElementById("g1Drop1")
        .textContent="?";

    document.getElementById("g1Drop2")
        .textContent="?";

    document.getElementById("g1Feedback")
        .textContent="";

    binaPilihanGame1();
}


function binaPilihanGame1(){

    const box =
        document.getElementById("g1Options");

    box.innerHTML="";

    const pilihan =
        [...g1Current.pilihan1];

    pilihan.sort(()=>Math.random()-.5);

    pilihan.forEach(x=>{

        const btn =
            document.createElement("button");

        btn.className="option";
        btn.draggable=true;
        btn.textContent=x;

        btn.ondragstart=e=>{
            e.dataTransfer.setData(
                "text/plain",
                x
            );
        };

        box.appendChild(btn);
    });
}


function allowDrop(e){
    e.preventDefault();
}


function dropSuku(e,part){

    e.preventDefault();

    const value =
        e.dataTransfer.getData("text/plain");

    const jawapan =
        part===1 ?
        g1Current.suku1 :
        g1Current.suku2;

    if(value!==jawapan){

        bunyiSalah();

        document.getElementById("g1Feedback")
            .textContent="❌ Cuba lagi.";

        gameLives--;

        paparStatus("g1");

        if(gameLives<=0){

            setTimeout(()=>{
                tamatGame(1);
            },600);

        }

        return;
    }

    bunyiBetul();
    mercunKecil();

    document.getElementById(
        part===1 ? "g1Drop1" : "g1Drop2"
    ).textContent=value;

    if(part===1){

        g1Part=2;

        const box =
            document.getElementById("g1Options");

        box.innerHTML="";

        g1Current.pilihan2
            .sort(()=>Math.random()-.5)
            .forEach(x=>{

                const btn =
                    document.createElement("button");

                btn.className="option";
                btn.draggable=true;
                btn.textContent=x;

                btn.ondragstart=e=>{
                    e.dataTransfer.setData(
                        "text/plain",
                        x
                    );
                };

                box.appendChild(btn);
            });

    }else{

        gameScore+=10;
        gameAnswered++;

        document.getElementById("g1Feedback")
            .textContent=
            `🎉 ${g1Current.perkataan}`;

        setTimeout(()=>{

            gameIndex++;

            if(gameIndex>=bahan.length){
                tamatGame(1);
            }else{
                paparGame1();
            }

        },900);
    }
}


/* =========================
   GAME 2
========================= */

function paparGame2(){

    if(gameIndex>=bahan.length){
        tamatGame(2);
        return;
    }

    const item=bahan[gameIndex];

    paparStatus("g2");

    document.getElementById("g2Image")
        .src=item.gambar;

    document.getElementById("g2Feedback")
        .textContent="";

    const options=[
        item.perkataan,
        bahan[(gameIndex+2)%bahan.length].perkataan,
        bahan[(gameIndex+5)%bahan.length].perkataan
    ];

    options.sort(()=>Math.random()-.5);

    const box=
        document.getElementById("g2Options");

    box.innerHTML="";

    options.forEach(word=>{

        const btn=
            document.createElement("button");

        btn.className="option";
        btn.textContent=word;

        btn.onclick=()=>{
            jawabGame2(word,item.perkataan);
        };

        box.appendChild(btn);
    });
}


function jawabGame2(pilihan,jawapan){

    if(pilihan!==jawapan){

        bunyiSalah();

        gameLives--;

        document.getElementById("g2Feedback")
            .textContent=
            "❌ Salah. Cuba lagi.";

        paparStatus("g2");

        if(gameLives<=0){

            setTimeout(()=>{
                tamatGame(2);
            },700);
        }

        return;
    }

    bunyiBetul();
    mercunKecil();

    gameScore+=10;
    gameAnswered++;

    document.getElementById("g2Feedback")
        .textContent="🎉 Betul!";

    setTimeout(()=>{

        gameIndex++;

        if(gameIndex>=bahan.length){
            tamatGame(2);
        }else{
            paparGame2();
        }

    },800);
}


/* =========================
   GAME 3
========================= */

function binaKeyboard(){

    const box=
        document.getElementById("keyboard");

    box.innerHTML="";

    const huruf=
        "abcdefghijklmnopqrstuvwxyz".split("");

    huruf.forEach(h=>{

        const btn=
            document.createElement("button");

        btn.className="key";
        btn.textContent=h;

        btn.onclick=()=>{
            tambahHuruf(h);
        };

        box.appendChild(btn);
    });
}


function paparGame3(){

    if(gameIndex>=bahan.length){
        tamatGame(3);
        return;
    }

    const item=bahan[gameIndex];

    paparStatus("g3");

    document.getElementById("g3Image")
        .src=item.gambar;

    g3Typed="";

    document.getElementById("g3Word")
        .textContent="";

    document.getElementById("g3Feedback")
        .textContent="";
}


function tambahHuruf(huruf){

    if(g3Typed.length>=6)return;

    g3Typed+=huruf;

    document.getElementById("g3Word")
        .textContent=g3Typed;
}


function padamHuruf(){

    g3Typed=
        g3Typed.slice(0,-1);

    document.getElementById("g3Word")
        .textContent=g3Typed;
}


function semakGame3(){

    const item=bahan[gameIndex];

    if(g3Typed===item.perkataan){

        bunyiBetul();
        mercunKecil();

        gameScore+=10;
        gameAnswered++;

        document.getElementById("g3Feedback")
            .textContent="🎉 Betul!";

        setTimeout(()=>{

            gameIndex++;

            if(gameIndex>=bahan.length){
                tamatGame(3);
            }else{
                paparGame3();
            }

        },800);

    }else{

        bunyiSalah();

        gameLives--;

        document.getElementById("g3Feedback")
            .textContent="❌ Cuba lagi.";

        paparStatus("g3");

        if(gameLives<=0){

            setTimeout(()=>{
                tamatGame(3);
            },700);
        }
    }
}

   TAMAT GAME
========================= */

function tamatGame(game){

    bunyiTahniah();
    mercunBesar();

    document.getElementById("tamatMessage")

        .textContent=
        `🏆 Markah: ${gameScore}`;

    bukaScreen("tamat");
}
