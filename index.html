#fireworks{

.bunga-api{

/* =====================================================

];

/* =====================================================
   AUDIO
   ===================================================== */

let audioContext;

function mulaAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

}


function bunyiNada(frekuensi,durasi){

    mulaAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.frequency.value = frekuensi;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    gain.gain.setValueAtTime(
        0.15,
        audioContext.currentTime
    );

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + durasi
    );

    oscillator.stop(
        audioContext.currentTime + durasi
    );

}


function bunyiBetul(){

    bunyiNada(700,0.15);

    setTimeout(()=>{
        bunyiNada(1000,0.2);
    },120);

}


function bunyiSalah(){

    bunyiNada(250,0.25);

}


function bunyiTahniah(){

    bunyiNada(600,0.15);

    setTimeout(()=>{
        bunyiNada(800,0.15);
    },150);

    setTimeout(()=>{
        bunyiNada(1000,0.3);
    },300);

}


/* =====================================================
   NAVIGASI
   ===================================================== */

function tutupSemua(){

    document
    .querySelectorAll("section")
    .forEach(section=>{
        section.classList.add("sembunyi");
    });

}


function bukaUtama(){

    tutupSemua();

    document
    .getElementById("utama")
    .classList.remove("sembunyi");

}


function bukaPengajaran(){

    tutupSemua();

    document
    .getElementById("pengajaran")
    .classList.remove("sembunyi");

    indeks = 0;

    paparAktiviti();

}


/* =====================================================
   PENGAJARAN
   ===================================================== */

function paparAktiviti(){

    const item = bahan[indeks];

    const ruang =
        document.getElementById(
            "aktivitiPengajaran"
        );

    ruang.innerHTML = `

        <img
            id="gambarPengajaran"
            src="${item.gambar}"
            alt="${item.perkataan}"
        >

        <h2>
            Baca perkataan:
            <strong>${item.perkataan}</strong>
        </h2>

        <div
            id="soalanPengajaran">
        </div>

    `;

    buatPilihanPertama();

}


function buatPilihanPertama(){

    const item = bahan[indeks];

    document.getElementById(
        "soalanPengajaran"
    ).innerHTML = `

        <p>
            Pilih suku kata pertama:
        </p>

        <div class="pilihan">

            ${item.pilihan1.map(suku=>`

                <button
                    onclick="semakPertama('${suku}')">
                    ${suku}
                </button>

            `).join("")}

        </div>

        <div
            class="mesej"
            id="mesejPertama">
        </div>

    `;

}


function semakPertama(jawapan){

    const item = bahan[indeks];

    const mesej =
        document.getElementById(
            "mesejPertama"
        );

    if(jawapan === item.suku1){

        mesej.innerHTML =
            "✅ Betul!";

        mesej.style.color = "green";

        bunyiBetul();

        setTimeout(
            buatPilihanKedua,
            700
        );

    }
    else{

        mesej.innerHTML =
            "❌ Cuba lagi!";

        mesej.style.color = "red";

        bunyiSalah();

    }

}


function buatPilihanKedua(){

/* =====================================================
   RODA
   ===================================================== */

const canvas =
    document.getElementById("rodaCanvas");

const ctx =
    canvas.getContext("2d");

let sedangPusing = false;
let sudut = 0;


function bukaRoda(){

    tutupSemua();

    document
    .getElementById("roda")
    .classList.remove("sembunyi");

    lukisRoda();

}


function lukisRoda(){

    const jumlah = bahan.length;

    const tengah = 175;

    const jejari = 170;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for(
        let i=0;
        i<jumlah;
        i++
    ){

        const mula =
            sudut +
            i *
            (2*Math.PI/jumlah);

        const akhir =
            sudut +
            (i+1) *
            (2*Math.PI/jumlah);

        ctx.beginPath();

        ctx.moveTo(
            tengah,
            tengah
        );

        ctx.arc(
            tengah,
            tengah,
            jejari,
            mula,
            akhir
        );

        ctx.closePath();

        ctx.fillStyle =
            i % 2 === 0
            ? "#fff3cd"
            : "#d6f5ff";

        ctx.fill();

        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 3;

        ctx.stroke();

        const imej =
            new Image();

        imej.src =
            bahan[i].gambar;

        const sudutTengah =
            (mula + akhir)/2;

        const x =
            tengah +
            Math.cos(sudutTengah) *
            105;

        const y =
            tengah +
            Math.sin(sudutTengah) *
            105;

        imej.onload = ()=>{

            ctx.save();

            ctx.translate(x,y);

            ctx.rotate(sudutTengah);

            ctx.drawImage(
                imej,
                -30,
                -30,
                60,
                60
            );

            ctx.restore();

        };

    }

}


function pusingRoda(){

    if(sedangPusing){
        return;
    }

    sedangPusing = true;

    mulaAudio();

    const tempoh = 3500;

    const mula = performance.now();

    const sudutAwal = sudut;

    const tambahan =
        Math.PI * 2 * 6 +
        Math.random() * Math.PI * 2;

    function animasi(masa){

        const kemajuan =
            Math.min(
                (masa-mula)/tempoh,
                1
            );

        const ease =
            1 -
            Math.pow(
                1-kemajuan,
                3
            );

        sudut =
            sudutAwal +
            tambahan *
            ease;

        lukisRoda();

        if(kemajuan < 1){

            requestAnimationFrame(
                animasi
            );

        }
        else{

            sedangPusing = false;

            tentukanHasil();

        }

    }

    requestAnimationFrame(animasi);

}


function tentukanHasil(){

    const jumlah = bahan.length;

    const setiap =
        (2*Math.PI)/jumlah;

    let sudutNormal =
        (2*Math.PI -
        (sudut % (2*Math.PI))) %
        (2*Math.PI);

    const indeksTerpilih =
        Math.floor(
            sudutNormal / setiap
        ) % jumlah;

    const item =
        bahan[indeksTerpilih];

    document.getElementById(
        "gambarRoda"
    ).src = item.gambar;

    document.getElementById(
        "perkataanRoda"
    ).innerHTML =
        item.perkataan.toUpperCase();

    bunyiTahniah();

}

        hurufDijawab.includes(huruf)

            if(

            ){

                tamatGame();

            }
            else{

                paparGame3();
